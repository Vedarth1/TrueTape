services:
  db:
    image: postgres:16-alpine
    container_name: truetape_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    container_name: truetape_api
    env_file: .env
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
  
  frontend:
    build: ./frontend
    container_name: truetape_web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # On a remote host set VITE_API_URL=http://<host-ip>:5001/api (e.g. in .env)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5001/api}
    depends_on:
      - backend

volumes:
  pgdata: